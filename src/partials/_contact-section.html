<section class="contact-contact-section">
  <div class="contact-contact-info">
    <div class="contact-contact-item">
      <div class="contact-contact-item-content">
        <img src="../assets/images/location_105096 1.svg" alt="Адрес офиса" class="contact-contact-icon">
        <div class="contact-contact-details">
          <h2 class="contact-contact-title">Наш офис</h2>
          <p class="contact-contact-text">Нижний Новгород,<br>Красносельская улица, 26</p>
        </div>
      </div>
    </div>

    <div class="contact-contact-item">
      <div class="contact-contact-item-content">
        <img src="../assets/images/phone-call-auricular-symbol-in-black_icon-icons.com_56483 1.svg" alt="Телефон" class="contact-contact-icon">
        <div class="contact-contact-details">
          <h2 class="contact-contact-title">Телефоны</h2>
          <p class="contact-contact-text">+7 (999) 123-45-67</p>
          <p class="contact-contact-text">+7 (952) 123-55-55</p>
        </div>
      </div>
    </div>

    <div class="contact-contact-item">
      <div class="contact-contact-item-content">
        <img src="../assets/images/Group.svg" alt="Email" class="contact-contact-icon">
        <div class="contact-contact-details">
          <h2 class="contact-contact-title">Электронная почта</h2>
          <p class="contact-contact-text">filyutin07@bk.ru</p>
        </div>
      </div>
    </div>

    <div class="contact-contact-item">
      <div class="contact-contact-item-content">
        <img src="../assets/images/calendar-weekly_icon-icons.com_56832 1.svg" alt="Режим работы" class="contact-contact-icon">
        <div class="contact-contact-details">
          <h2 class="contact-contact-title">Режим работы</h2>
          <p class="contact-contact-text">Пн-Пт: 8:00-22:00</p>
        </div>
      </div>
    </div>
  </div>

  <div class="contact-contact-form-section">
    <form class="contact-form-container" id="contactForm">
      <h2 class="contact-form-title">Свяжитесь с нами</h2>
      
      <div class="contact-form-group">
        <label for="name" class="contact-form-label">Ваше имя</label>
        <input type="text" id="name" name="name" class="contact-form-input" placeholder="Введите ваше имя" required>
      </div>

      <div class="contact-form-group">
        <label for="phone" class="contact-form-label">Телефонный номер</label>
        <input type="tel" id="phone" name="phone" class="contact-form-input" placeholder="+7 (999) 123-45-67" required>
      </div>

      <div class="contact-form-group">
        <label for="email" class="contact-form-label">Электронная почта</label>
        <input type="email" id="email" name="email" class="contact-form-input" placeholder="Введите имя электронной почты" required>
      </div>

      <div class="contact-form-group">
        <label for="message" class="contact-form-label">Сообщение</label>
        <textarea id="message" name="message" class="contact-form-textarea" placeholder="Опишите ваш запрос или интересующий объект" required></textarea>
      </div>

      <button type="submit" class="contact-form-button">ОТПРАВИТЬ СООБЩЕНИЕ</button>
    </form>
  </div>
</section>
