<section class="contact-map-section">
  <div class="contact-map-container">
    <div class="contact-map-content">
      <div class="contact-map-header">
        <h2 class="contact-map-title">КАК НАС НАЙТИ</h2>
        <div class="contact-map-info">
          <p class="contact-map-description">Мы находимся в центре Москвы, в пешей доступности от метро</p>
          <p class="contact-map-address">Нижний Новгород, Красносельская улица, 26</p>
        </div>
      </div>
      
      <div class="contact-map-widget-container">
        <div class="contact-map-widget">
          <iframe
            title="Карта расположения офиса Альтернатива"
            src="https://www.openstreetmap.org/export/embed.html?bbox=43.9876 ,56.2961,44.0057,56.3080&layer=mapnik"
            class="contact-map-iframe"
            allowfullscreen
            loading="lazy">
          </iframe>
        </div>
        <button class="contact-route-button" onclick="window.open('https://maps.yandex.ru/ ', '_blank')">Построить маршрут</button>
      </div>
    </div>
  </div>
</section>
